<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Caritas Arbeitszeit-Rechner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1 id="titleText">Arbeitszeiten [Monat 2026]</h1>
      <p class="subtitle">Frühdienst + Spätdienst mit Stunden- und Einheitenberechnung</p>
    </header>

    <section class="toolbar card">
      <div class="toolbar-main">
        <button id="calcBtn" class="btn btn-accent" type="button">Berechnen</button>
        <button id="saveBtn" class="btn" type="button">Speichern</button>
        <button id="nextMonthBtn" class="btn" type="button">Nächster Monat</button>
        <button id="exportBtn" class="btn" type="button">CSV kopieren</button>
      </div>
      <p id="statusText" class="status-text">Bereit.</p>
    </section>

    <section class="card table-card">
      <div class="table-wrap">
        <table id="timesheetTable">
          <thead>
            <tr>
              <th>Datum</th>
              <th>Früh Start</th>
              <th>Früh Ende</th>
              <th>Früh Einheiten</th>
              <th>Spät Start</th>
              <th>Spät Ende</th>
              <th>Spät Einheiten</th>
              <th>Summe</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <footer class="card totals">
      <div class="total-item">
        <span>Monats-Total Stunden</span>
        <strong id="monthHours">0:00</strong>
      </div>
      <div class="total-item">
        <span>Monats-Total Einheiten</span>
        <strong id="monthUnits">0</strong>
      </div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
