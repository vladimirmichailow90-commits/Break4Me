<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Arbeitszeit" />
  <title>Caritas Arbeitszeit-Rechner</title>
  <style>
    :root {
      --bg: #0e0e11;
      --panel: #1a1a22;
      --panel-soft: #20202a;
      --line: #2f2f3d;
      --text: #efeff4;
      --muted: #aaaab8;
      --accent: #8e44ad;
      --accent-strong: #7d34a0;
      --ok: #5dd39e;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top right, rgba(142, 68, 173, 0.22), transparent 35%), var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    .app-shell {
      max-width: 1300px;
      margin: 0 auto;
      padding: 14px;
      padding-top: max(14px, env(safe-area-inset-top));
      display: grid;
      gap: 12px;
    }

    .app-header h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card {
      background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 94%, transparent), var(--panel));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
    }

    .toolbar { display: grid; gap: 8px; }

    .toolbar-main {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-soft);
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { opacity: 0.75; }

    .btn-accent {
      background: linear-gradient(180deg, #a55fca, var(--accent));
      border-color: #a15cc7;
    }

    .status-text {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 10px;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      font-size: 0.86rem;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 8px;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      background: #232334;
      z-index: 1;
      font-size: 0.8rem;
      color: #dfd1f7;
    }

    tr:hover td {
      background: color-mix(in srgb, var(--panel-soft) 70%, transparent);
    }

    .day-cell {
      white-space: nowrap;
      color: var(--muted);
      font-weight: 700;
    }

    .time-input {
      width: 100%;
      min-width: 110px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #14141b;
      color: var(--text);
      padding: 6px 8px;
      font-size: 0.86rem;
    }

    .unit-cell, .sum-cell {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .sum-cell { color: var(--ok); }

    .totals {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .total-item {
      min-width: 220px;
      display: grid;
      gap: 4px;
    }

    .total-item span {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .total-item strong { font-size: 1.1rem; }

    @media (max-width: 720px) {
      .app-shell { padding: 10px; }
      .app-header h1 { font-size: 1.15rem; }
      .btn { flex: 1 1 45%; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1 id="titleText">Arbeitszeiten [Monat 2026]</h1>
      <p class="subtitle">Frühdienst + Spätdienst mit Stunden- und Einheitenberechnung</p>
    </header>

    <section class="toolbar card">
      <div class="toolbar-main">
        <button id="calcBtn" class="btn btn-accent" type="button">Berechnen</button>
        <button id="saveBtn" class="btn" type="button">Speichern</button>
        <button id="prevMonthBtn" class="btn" type="button">◀ Vorheriger Monat</button>
        <button id="nextMonthBtn" class="btn" type="button">Nächster Monat ▶</button>
        <button id="exportBtn" class="btn" type="button">CSV kopieren</button>
      </div>
      <p id="statusText" class="status-text">Bereit.</p>
    </section>

    <section class="card table-card">
      <div class="table-wrap">
        <table id="timesheetTable">
          <thead>
            <tr>
              <th>Datum</th>
              <th>Früh Start</th>
              <th>Früh Ende</th>
              <th>Früh Einheiten</th>
              <th>Spät Start</th>
              <th>Spät Ende</th>
              <th>Spät Einheiten</th>
              <th>Summe</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <footer class="card totals">
      <div class="total-item">
        <span>Monats-Total Stunden</span>
        <strong id="monthHours">0:00</strong>
      </div>
      <div class="total-item">
        <span>Monats-Total Einheiten</span>
        <strong id="monthUnits">0</strong>
      </div>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = "caritas-arbeitszeit-data-v1";
    const DAYS_IN_TABLE = 31;
    const UNIT_PER_HOUR = 100;

    const monthNames = [
      "Januar", "Februar", "März", "April", "Mai", "Juni",
      "Juli", "August", "September", "Oktober", "November", "Dezember"
    ];

    const titleText = document.getElementById("titleText");
    const tableBody = document.getElementById("tableBody");
    const statusText = document.getElementById("statusText");
    const monthHours = document.getElementById("monthHours");
    const monthUnits = document.getElementById("monthUnits");

    const calcBtn = document.getElementById("calcBtn");
    const saveBtn = document.getElementById("saveBtn");
    const prevMonthBtn = document.getElementById("prevMonthBtn");
    const nextMonthBtn = document.getElementById("nextMonthBtn");
    const exportBtn = document.getElementById("exportBtn");

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();

    init();

    function init() {
      buildTableRows();
      updateHeader();
      loadMonthData();
      recalculateMonth();

      calcBtn.addEventListener("click", () => {
        recalculateMonth();
        setStatus("Berechnung aktualisiert.");
      });

      saveBtn.addEventListener("click", () => {
        saveMonthData();
        setStatus("Monat gespeichert.");
      });

      prevMonthBtn.addEventListener("click", () => {
        goToPrevMonth();
      });

      nextMonthBtn.addEventListener("click", () => {
        goToNextMonth();
      });

      exportBtn.addEventListener("click", async () => {
        await copyCsv();
      });

      tableBody.addEventListener("input", () => {
        recalculateMonth();
      });
    }

    function buildTableRows() {
      const fragment = document.createDocumentFragment();

      for (let day = 1; day <= DAYS_IN_TABLE; day += 1) {
        const tr = document.createElement("tr");
        tr.dataset.day = String(day);

        tr.innerHTML = `
          <td class="day-cell">${String(day).padStart(2, "0")}.</td>
          <td><input class="time-input" type="time" data-field="earlyStart" /></td>
          <td><input class="time-input" type="time" data-field="earlyEnd" /></td>
          <td class="unit-cell" data-out="earlyUnits">0</td>
          <td><input class="time-input" type="time" data-field="lateStart" /></td>
          <td><input class="time-input" type="time" data-field="lateEnd" /></td>
          <td class="unit-cell" data-out="lateUnits">0</td>
          <td class="sum-cell" data-out="daySum">0</td>
        `;

        fragment.appendChild(tr);
      }

      tableBody.innerHTML = "";
      tableBody.appendChild(fragment);
    }

    function monthKey() {
      const mm = String(currentMonth + 1).padStart(2, "0");
      return `${currentYear}-${mm}`;
    }

    function loadAllMonthsData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveAllMonthsData(allMonths) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allMonths));
    }

    function updateHeader() {
      titleText.textContent = `Arbeitszeiten [${monthNames[currentMonth]} ${currentYear}]`;
    }

    function clearTableInputs() {
      const inputs = tableBody.querySelectorAll("input[type='time']");
      inputs.forEach((input) => { input.value = ""; });
    }

    function collectMonthData() {
      const rows = Array.from(tableBody.querySelectorAll("tr"));

      return rows.map((row) => {
        const day = Number(row.dataset.day);
        return {
          day,
          earlyStart: row.querySelector("[data-field='earlyStart']")?.value || "",
          earlyEnd: row.querySelector("[data-field='earlyEnd']")?.value || "",
          lateStart: row.querySelector("[data-field='lateStart']")?.value || "",
          lateEnd: row.querySelector("[data-field='lateEnd']")?.value || ""
        };
      });
    }

    function applyMonthData(rowsData) {
      clearTableInputs();

      if (!Array.isArray(rowsData)) return;

      for (const entry of rowsData) {
        const day = Number(entry.day);
        if (!Number.isInteger(day) || day < 1 || day > DAYS_IN_TABLE) continue;

        const row = tableBody.querySelector(`tr[data-day='${day}']`);
        if (!row) continue;

        row.querySelector("[data-field='earlyStart']").value = normalizeTime(entry.earlyStart);
        row.querySelector("[data-field='earlyEnd']").value = normalizeTime(entry.earlyEnd);
        row.querySelector("[data-field='lateStart']").value = normalizeTime(entry.lateStart);
        row.querySelector("[data-field='lateEnd']").value = normalizeTime(entry.lateEnd);
      }
    }

    function saveMonthData() {
      const allMonths = loadAllMonthsData();
      const payload = {
        savedAt: new Date().toISOString(),
        rows: collectMonthData()
      };

      allMonths[monthKey()] = payload;
      saveAllMonthsData(allMonths);
    }

    function loadMonthData() {
      const allMonths = loadAllMonthsData();
      const monthData = allMonths[monthKey()];

      if (!monthData) {
        clearTableInputs();
        setStatus("Kein gespeicherter Monat gefunden.");
        return;
      }

      try {
        applyMonthData(monthData.rows);
        setStatus("Monat geladen.");
      } catch {
        clearTableInputs();
        setStatus("Fehler beim Laden.");
      }
    }

    function goToPrevMonth() {
      currentMonth -= 1;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear -= 1;
      }
      updateHeader();
      loadMonthData();
      recalculateMonth();
    }

    function goToNextMonth() {
      currentMonth += 1;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear += 1;
      }
      updateHeader();
      loadMonthData();
      recalculateMonth();
    }

    function normalizeTime(value) {
      const str = String(value || "").trim();
      if (!/^\d{2}:\d{2}$/.test(str)) return "";
      const [h, m] = str.split(":").map(Number);
      if (h < 0 || h > 23 || m < 0 || m > 59) return "";
      return str;
    }

    function toMinutes(timeText) {
      const val = normalizeTime(timeText);
      if (!val) return null;
      const [hh, mm] = val.split(":").map(Number);
      return hh * 60 + mm;
    }

    function minutesDiff(startText, endText) {
      const start = toMinutes(startText);
      const end = toMinutes(endText);
      if (start === null || end === null) return 0;
      let diff = end - start;
      if (diff < 0) diff += 24 * 60;
      return diff;
    }

    function minutesToUnits(minutes) {
      return Math.round((minutes / 60) * UNIT_PER_HOUR);
    }

    function minutesToHourString(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return `${h}:${String(m).padStart(2, "0")}`;
    }

    function recalculateMonth() {
      const rows = Array.from(tableBody.querySelectorAll("tr"));
      let monthMinutesTotal = 0;
      let monthUnitsTotal = 0;

      for (const row of rows) {
        const earlyStart = row.querySelector("[data-field='earlyStart']")?.value || "";
        const earlyEnd = row.querySelector("[data-field='earlyEnd']")?.value || "";
        const lateStart = row.querySelector("[data-field='lateStart']")?.value || "";
        const lateEnd = row.querySelector("[data-field='lateEnd']")?.value || "";

        const earlyMinutes = minutesDiff(earlyStart, earlyEnd);
        const lateMinutes = minutesDiff(lateStart, lateEnd);
        const earlyUnits = minutesToUnits(earlyMinutes);
        const lateUnits = minutesToUnits(lateMinutes);
        const dayMinutes = earlyMinutes + lateMinutes;
        const dayUnits = earlyUnits + lateUnits;

        row.querySelector("[data-out='earlyUnits']").textContent = String(earlyUnits);
        row.querySelector("[data-out='lateUnits']").textContent = String(lateUnits);
        row.querySelector("[data-out='daySum']").textContent = `${minutesToHourString(dayMinutes)} (${dayUnits})`;

        monthMinutesTotal += dayMinutes;
        monthUnitsTotal += dayUnits;
      }

      monthHours.textContent = minutesToHourString(monthMinutesTotal);
      monthUnits.textContent = String(monthUnitsTotal);
    }

    function buildCsvText() {
      const lines = [];
      lines.push(`Arbeitszeiten;${monthNames[currentMonth]} ${currentYear}`);
      lines.push("Datum;Früh Start;Früh Ende;Früh Einheiten;Spät Start;Spät Ende;Spät Einheiten;Summe");

      const rows = Array.from(tableBody.querySelectorAll("tr"));
      for (const row of rows) {
        const dayLabel = row.querySelector(".day-cell")?.textContent || "";
        const earlyStart = row.querySelector("[data-field='earlyStart']")?.value || "";
        const earlyEnd = row.querySelector("[data-field='earlyEnd']")?.value || "";
        const earlyUnits = row.querySelector("[data-out='earlyUnits']")?.textContent || "0";
        const lateStart = row.querySelector("[data-field='lateStart']")?.value || "";
        const lateEnd = row.querySelector("[data-field='lateEnd']")?.value || "";
        const lateUnits = row.querySelector("[data-out='lateUnits']")?.textContent || "0";
        const daySum = row.querySelector("[data-out='daySum']")?.textContent || "";

        lines.push([dayLabel, earlyStart, earlyEnd, earlyUnits, lateStart, lateEnd, lateUnits, daySum].join(";"));
      }

      lines.push(`Monats-Total Stunden;${monthHours.textContent}`);
      lines.push(`Monats-Total Einheiten;${monthUnits.textContent}`);

      return lines.join("\n");
    }

    async function copyCsv() {
      const csv = buildCsvText();

      try {
        await navigator.clipboard.writeText(csv);
        setStatus("CSV wurde in die Zwischenablage kopiert.");
      } catch {
        const area = document.createElement("textarea");
        area.value = csv;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        document.body.removeChild(area);
        setStatus("CSV kopiert (Fallback).");
      }
    }

    function setStatus(text) {
      statusText.textContent = text;
    }
  </script>
</body>
</html>
