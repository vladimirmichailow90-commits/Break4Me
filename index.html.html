<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Arbeitszeit" />
  <title>Caritas Arbeitszeit-Rechner</title>
  <style>
    :root {
      --bg: #0e0e11;
      --panel: #1a1a22;
      --panel-soft: #20202a;
      --line: #2f2f3d;
      --text: #efeff4;
      --muted: #aaaab8;
      --accent: #8e44ad;
      --accent-strong: #7d34a0;
      --ok: #5dd39e;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top right, rgba(142, 68, 173, 0.22), transparent 35%), var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
      font-size: 16px;
    }

    .app-shell {
      max-width: 1300px;
      margin: 0 auto;
      padding: 14px;
      padding-top: max(14px, env(safe-area-inset-top));
      display: grid;
      gap: 12px;
    }

    .app-header h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card {
      background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 94%, transparent), var(--panel));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
    }

    .toolbar { display: grid; gap: 8px; }

    .toolbar-main {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar-options {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .toolbar-options input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-soft);
      color: var(--text);
      min-height: 44px;
      padding: 10px 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:active { opacity: 0.75; }

    .btn-accent {
      background: linear-gradient(180deg, #a55fca, var(--accent));
      border-color: #a15cc7;
    }

    .status-text {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 10px;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      font-size: 0.86rem;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 8px;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      background: #232334;
      z-index: 1;
      font-size: 0.8rem;
      color: #dfd1f7;
    }

    tr:hover td {
      background: color-mix(in srgb, var(--panel-soft) 70%, transparent);
    }

    .day-cell {
      white-space: nowrap;
      color: var(--muted);
      font-weight: 700;
      position: relative;
      cursor: pointer;
    }

    .day-cell .mobile-hint {
      display: none;
    }

    .time-input {
      width: 100%;
      min-width: 92px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #14141b;
      color: var(--text);
      padding: 10px 10px;
      min-height: 44px;
      font-size: 16px;
    }

    .time-input:focus {
      outline: none;
      border-color: #a15cc7;
      box-shadow: 0 0 0 2px rgba(161, 92, 199, 0.28);
    }

    .unit-cell, .sum-cell {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .sum-cell { color: var(--ok); }

    .totals {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .total-item {
      min-width: 220px;
      display: grid;
      gap: 4px;
    }

    .total-item span {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .total-item strong { font-size: 1.1rem; }

    @media (max-width: 720px) {
      .app-shell { padding: 10px; }
      .app-header h1 { font-size: 1.15rem; }
      .toolbar-main { display: grid; grid-template-columns: 1fr 1fr; }
      .btn { width: 100%; }
      .toolbar-options { font-size: 0.86rem; }

      .table-wrap {
        overflow: visible;
      }

      table {
        min-width: 0;
        width: 100%;
        font-size: 0.92rem;
      }

      thead {
        display: none;
      }

      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      tr {
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 10px;
        overflow: hidden;
        background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 94%, transparent), var(--panel));
      }

      td {
        border-bottom: 1px solid var(--line);
        padding: 10px;
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 8px;
        align-items: center;
      }

      td::before {
        content: attr(data-label);
        color: var(--muted);
        font-weight: 700;
      }

      td:last-child {
        border-bottom: 0;
      }

      td.day-cell {
        background: color-mix(in srgb, var(--panel-soft) 72%, transparent);
        font-weight: 800;
        grid-template-columns: 1fr;
        font-size: 1rem;
      }

      td.day-cell::before {
        content: none;
      }

      .day-cell .mobile-hint {
        display: inline;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 600;
        margin-left: 8px;
      }

      tr:not(.is-open) td:not(.day-cell):not(.sum-cell) {
        display: none;
      }

      tr:not(.is-open) .sum-cell {
        display: grid;
      }

      tr.is-open td {
        display: grid;
      }

      tr.is-open td.day-cell {
        border-bottom: 1px solid var(--line);
      }

      .time-input {
        min-width: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1 id="titleText">Arbeitszeiten [Monat 2026]</h1>
      <p class="subtitle">Frühdienst + Spätdienst mit Stunden- und Einheitenberechnung</p>
    </header>

    <section class="toolbar card">
      <div class="toolbar-main">
        <button id="calcBtn" class="btn btn-accent" type="button">Berechnen</button>
        <button id="saveBtn" class="btn" type="button">Speichern</button>
        <button id="prevMonthBtn" class="btn" type="button">◀ Vorheriger Monat</button>
        <button id="nextMonthBtn" class="btn" type="button">Nächster Monat ▶</button>
        <button id="exportBtn" class="btn" type="button">CSV kopieren</button>
      </div>
      <label class="toolbar-options" for="pickerModeToggle">
        <input id="pickerModeToggle" type="checkbox" />
        iPhone-Rad
      </label>
      <p id="statusText" class="status-text">Bereit.</p>
    </section>

    <section class="card table-card">
      <div class="table-wrap">
        <table id="timesheetTable">
          <thead>
            <tr>
              <th>Datum</th>
              <th>Früh Start</th>
              <th>Früh Ende</th>
              <th>Früh Einheiten</th>
              <th>Spät Start</th>
              <th>Spät Ende</th>
              <th>Spät Einheiten</th>
              <th>Summe</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <footer class="card totals">
      <div class="total-item">
        <span>Monats-Total Stunden</span>
        <strong id="monthHours">0:00</strong>
      </div>
      <div class="total-item">
        <span>Monats-Total Einheiten</span>
        <strong id="monthUnits">0</strong>
      </div>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = "caritas-arbeitszeit-data-v1";
    const PICKER_MODE_KEY = "caritas-picker-mode-v1";
    const DAYS_IN_TABLE = 31;
    const UNIT_PER_HOUR = 100;

    const monthNames = [
      "Januar", "Februar", "März", "April", "Mai", "Juni",
      "Juli", "August", "September", "Oktober", "November", "Dezember"
    ];

    const titleText = document.getElementById("titleText");
    const tableBody = document.getElementById("tableBody");
    const statusText = document.getElementById("statusText");
    const monthHours = document.getElementById("monthHours");
    const monthUnits = document.getElementById("monthUnits");

    const calcBtn = document.getElementById("calcBtn");
    const saveBtn = document.getElementById("saveBtn");
    const prevMonthBtn = document.getElementById("prevMonthBtn");
    const nextMonthBtn = document.getElementById("nextMonthBtn");
    const exportBtn = document.getElementById("exportBtn");
    const pickerModeToggle = document.getElementById("pickerModeToggle");
    const isIOSPlatform = detectIOSPlatform();
    let useNativeIOSPicker = getPickerModeFromStorage(isIOSPlatform);

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();

    init();

    function init() {
      buildTableRows();
      initMobileRowToggle();
      syncPickerToggleUI();
      updateHeader();
      loadMonthData();
      recalculateMonth();

      calcBtn.addEventListener("click", () => {
        recalculateMonth();
        setStatus("Berechnung aktualisiert.");
      });

      saveBtn.addEventListener("click", () => {
        saveMonthData();
        setStatus("Monat gespeichert.");
      });

      prevMonthBtn.addEventListener("click", () => {
        goToPrevMonth();
      });

      nextMonthBtn.addEventListener("click", () => {
        goToNextMonth();
      });

      exportBtn.addEventListener("click", async () => {
        await copyCsv();
      });

      pickerModeToggle?.addEventListener("change", () => {
        useNativeIOSPicker = pickerModeToggle.checked;
        savePickerModeToStorage(useNativeIOSPicker);
        rebuildTimeInputsForMode();
        setStatus(useNativeIOSPicker ? "iPhone-Zeitrad aktiviert." : "Zahleneingabe aktiviert.");
      });

      tableBody.addEventListener("input", () => {
        recalculateMonth();
      });

      tableBody.addEventListener("input", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement) || !target.classList.contains("time-input")) return;

        if (target.type !== "text") {
          recalculateMonth();
          return;
        }

        target.value = formatTimeInputWhileTyping(target.value);
        recalculateMonth();
      });

      tableBody.addEventListener("blur", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement) || !target.classList.contains("time-input")) return;

        if (target.type !== "text") return;

        target.value = normalizeTime(target.value);
        recalculateMonth();
      }, true);

      window.addEventListener("resize", () => {
        applyMobileOpenRow();
      });
    }

    function buildTableRows() {
      const fragment = document.createDocumentFragment();

      for (let day = 1; day <= DAYS_IN_TABLE; day += 1) {
        const tr = document.createElement("tr");
        tr.dataset.day = String(day);

        tr.innerHTML = `
          <td class="day-cell" data-label="Datum">${String(day).padStart(2, "0")}.<span class="mobile-hint">tippen zum Aufklappen</span></td>
          <td data-label="Früh Start">${buildTimeInput("earlyStart")}</td>
          <td data-label="Früh Ende">${buildTimeInput("earlyEnd")}</td>
          <td class="unit-cell" data-label="Früh Einheiten" data-out="earlyUnits">0</td>
          <td data-label="Spät Start">${buildTimeInput("lateStart")}</td>
          <td data-label="Spät Ende">${buildTimeInput("lateEnd")}</td>
          <td class="unit-cell" data-label="Spät Einheiten" data-out="lateUnits">0</td>
          <td class="sum-cell" data-label="Summe" data-out="daySum">0</td>
        `;

        fragment.appendChild(tr);
      }

      tableBody.innerHTML = "";
      tableBody.appendChild(fragment);
      applyMobileOpenRow();
    }

    function detectIOSPlatform() {
      const ua = navigator.userAgent || "";
      const isIOSDevice = /iPhone|iPad|iPod/.test(ua);
      const isIPadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
      return isIOSDevice || isIPadOS;
    }

    function getPickerModeFromStorage(defaultValue) {
      try {
        const raw = localStorage.getItem(PICKER_MODE_KEY);
        if (raw === "native") return true;
        if (raw === "text") return false;
      } catch {
        // Ignore storage issues and use default.
      }
      return defaultValue;
    }

    function savePickerModeToStorage(useNative) {
      try {
        localStorage.setItem(PICKER_MODE_KEY, useNative ? "native" : "text");
      } catch {
        // Ignore storage issues.
      }
    }

    function syncPickerToggleUI() {
      if (!pickerModeToggle) return;
      pickerModeToggle.checked = useNativeIOSPicker;
    }

    function rebuildTimeInputsForMode() {
      const currentRows = collectMonthData();
      buildTableRows();
      applyMonthData(currentRows);
      recalculateMonth();
    }

    function buildTimeInput(fieldName) {
      if (useNativeIOSPicker) {
        return `<input class="time-input" type="time" step="60" data-field="${fieldName}" />`;
      }

      return `<input class="time-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="HH:MM" autocomplete="off" data-field="${fieldName}" />`;
    }

    function isMobileView() {
      return window.matchMedia("(max-width: 720px)").matches;
    }

    function getTodayDayNumber() {
      const now = new Date();
      if (now.getFullYear() !== currentYear || now.getMonth() !== currentMonth) return 1;
      return now.getDate();
    }

    function applyMobileOpenRow() {
      const rows = Array.from(tableBody.querySelectorAll("tr"));
      if (!rows.length) return;

      if (!isMobileView()) {
        rows.forEach((row) => row.classList.add("is-open"));
        return;
      }

      const active = tableBody.querySelector("tr.is-open");
      if (active) {
        rows.forEach((row) => {
          if (row !== active) row.classList.remove("is-open");
        });
        return;
      }

      const day = getTodayDayNumber();
      const target = tableBody.querySelector(`tr[data-day='${day}']`) || rows[0];
      rows.forEach((row) => row.classList.remove("is-open"));
      target.classList.add("is-open");
    }

    function initMobileRowToggle() {
      tableBody.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;

        const clickedDayCell = target.closest("td.day-cell");
        if (!clickedDayCell || !isMobileView()) return;

        const row = clickedDayCell.closest("tr");
        if (!row) return;

        const rows = Array.from(tableBody.querySelectorAll("tr"));
        rows.forEach((item) => {
          if (item !== row) item.classList.remove("is-open");
        });
        row.classList.toggle("is-open");

        if (!tableBody.querySelector("tr.is-open")) {
          row.classList.add("is-open");
        }
      });
    }

    function monthKey() {
      const mm = String(currentMonth + 1).padStart(2, "0");
      return `${currentYear}-${mm}`;
    }

    function loadAllMonthsData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveAllMonthsData(allMonths) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allMonths));
    }

    function updateHeader() {
      titleText.textContent = `Arbeitszeiten [${monthNames[currentMonth]} ${currentYear}]`;
    }

    function clearTableInputs() {
      const inputs = tableBody.querySelectorAll(".time-input");
      inputs.forEach((input) => { input.value = ""; });
    }

    function formatTimeInputWhileTyping(value) {
      const digits = String(value || "").replace(/\D/g, "").slice(0, 4);
      if (digits.length <= 2) return digits;
      return `${digits.slice(0, 2)}:${digits.slice(2)}`;
    }

    function collectMonthData() {
      const rows = Array.from(tableBody.querySelectorAll("tr"));

      return rows.map((row) => {
        const day = Number(row.dataset.day);
        return {
          day,
          earlyStart: row.querySelector("[data-field='earlyStart']")?.value || "",
          earlyEnd: row.querySelector("[data-field='earlyEnd']")?.value || "",
          lateStart: row.querySelector("[data-field='lateStart']")?.value || "",
          lateEnd: row.querySelector("[data-field='lateEnd']")?.value || ""
        };
      });
    }

    function applyMonthData(rowsData) {
      clearTableInputs();

      if (!Array.isArray(rowsData)) return;

      for (const entry of rowsData) {
        const day = Number(entry.day);
        if (!Number.isInteger(day) || day < 1 || day > DAYS_IN_TABLE) continue;

        const row = tableBody.querySelector(`tr[data-day='${day}']`);
        if (!row) continue;

        row.querySelector("[data-field='earlyStart']").value = normalizeTime(entry.earlyStart);
        row.querySelector("[data-field='earlyEnd']").value = normalizeTime(entry.earlyEnd);
        row.querySelector("[data-field='lateStart']").value = normalizeTime(entry.lateStart);
        row.querySelector("[data-field='lateEnd']").value = normalizeTime(entry.lateEnd);
      }
    }

    function saveMonthData() {
      const allMonths = loadAllMonthsData();
      const payload = {
        savedAt: new Date().toISOString(),
        rows: collectMonthData()
      };

      allMonths[monthKey()] = payload;
      saveAllMonthsData(allMonths);
    }

    function loadMonthData() {
      const allMonths = loadAllMonthsData();
      const monthData = allMonths[monthKey()];

      if (!monthData) {
        clearTableInputs();
        setStatus("Kein gespeicherter Monat gefunden.");
        return;
      }

      try {
        applyMonthData(monthData.rows);
        setStatus("Monat geladen.");
      } catch {
        clearTableInputs();
        setStatus("Fehler beim Laden.");
      }
    }

    function goToPrevMonth() {
      currentMonth -= 1;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear -= 1;
      }
      updateHeader();
      loadMonthData();
      recalculateMonth();
      applyMobileOpenRow();
    }

    function goToNextMonth() {
      currentMonth += 1;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear += 1;
      }
      updateHeader();
      loadMonthData();
      recalculateMonth();
      applyMobileOpenRow();
    }

    function normalizeTime(value) {
      const str = String(value || "").trim();
      if (!str) return "";

      let hh;
      let mm;

      if (/^\d{3,4}$/.test(str)) {
        const raw = str.padStart(4, "0");
        hh = Number(raw.slice(0, 2));
        mm = Number(raw.slice(2, 4));
      } else if (/^\d{1,2}:\d{1,2}$/.test(str)) {
        const parts = str.split(":");
        hh = Number(parts[0]);
        mm = Number(parts[1]);
      } else {
        return "";
      }

      if (hh < 0 || hh > 23 || mm < 0 || mm > 59) return "";
      return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
    }

    function toMinutes(timeText) {
      const val = normalizeTime(timeText);
      if (!val) return null;
      const [hh, mm] = val.split(":").map(Number);
      return hh * 60 + mm;
    }

    function minutesDiff(startText, endText) {
      const start = toMinutes(startText);
      const end = toMinutes(endText);
      if (start === null || end === null) return 0;
      let diff = end - start;
      if (diff < 0) diff += 24 * 60;
      return diff;
    }

    function minutesToUnits(minutes) {
      return Math.round((minutes / 60) * UNIT_PER_HOUR);
    }

    function minutesToHourString(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return `${h}:${String(m).padStart(2, "0")}`;
    }

    function recalculateMonth() {
      const rows = Array.from(tableBody.querySelectorAll("tr"));
      let monthMinutesTotal = 0;
      let monthUnitsTotal = 0;

      for (const row of rows) {
        const earlyStart = row.querySelector("[data-field='earlyStart']")?.value || "";
        const earlyEnd = row.querySelector("[data-field='earlyEnd']")?.value || "";
        const lateStart = row.querySelector("[data-field='lateStart']")?.value || "";
        const lateEnd = row.querySelector("[data-field='lateEnd']")?.value || "";

        const earlyMinutes = minutesDiff(earlyStart, earlyEnd);
        const lateMinutes = minutesDiff(lateStart, lateEnd);
        const earlyUnits = minutesToUnits(earlyMinutes);
        const lateUnits = minutesToUnits(lateMinutes);
        const dayMinutes = earlyMinutes + lateMinutes;
        const dayUnits = earlyUnits + lateUnits;

        row.querySelector("[data-out='earlyUnits']").textContent = String(earlyUnits);
        row.querySelector("[data-out='lateUnits']").textContent = String(lateUnits);
        row.querySelector("[data-out='daySum']").textContent = `${minutesToHourString(dayMinutes)} (${dayUnits})`;

        monthMinutesTotal += dayMinutes;
        monthUnitsTotal += dayUnits;
      }

      monthHours.textContent = minutesToHourString(monthMinutesTotal);
      monthUnits.textContent = String(monthUnitsTotal);
    }

    function buildCsvText() {
      const lines = [];
      lines.push(`Arbeitszeiten;${monthNames[currentMonth]} ${currentYear}`);
      lines.push("Datum;Früh Start;Früh Ende;Früh Einheiten;Spät Start;Spät Ende;Spät Einheiten;Summe");

      const rows = Array.from(tableBody.querySelectorAll("tr"));
      for (const row of rows) {
        const dayLabel = row.querySelector(".day-cell")?.textContent || "";
        const earlyStart = row.querySelector("[data-field='earlyStart']")?.value || "";
        const earlyEnd = row.querySelector("[data-field='earlyEnd']")?.value || "";
        const earlyUnits = row.querySelector("[data-out='earlyUnits']")?.textContent || "0";
        const lateStart = row.querySelector("[data-field='lateStart']")?.value || "";
        const lateEnd = row.querySelector("[data-field='lateEnd']")?.value || "";
        const lateUnits = row.querySelector("[data-out='lateUnits']")?.textContent || "0";
        const daySum = row.querySelector("[data-out='daySum']")?.textContent || "";

        lines.push([dayLabel, earlyStart, earlyEnd, earlyUnits, lateStart, lateEnd, lateUnits, daySum].join(";"));
      }

      lines.push(`Monats-Total Stunden;${monthHours.textContent}`);
      lines.push(`Monats-Total Einheiten;${monthUnits.textContent}`);

      return lines.join("\n");
    }

    async function copyCsv() {
      const csv = buildCsvText();

      try {
        await navigator.clipboard.writeText(csv);
        setStatus("CSV wurde in die Zwischenablage kopiert.");
      } catch {
        const area = document.createElement("textarea");
        area.value = csv;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        document.body.removeChild(area);
        setStatus("CSV kopiert (Fallback).");
      }
    }

    function setStatus(text) {
      statusText.textContent = text;
    }
  </script>
